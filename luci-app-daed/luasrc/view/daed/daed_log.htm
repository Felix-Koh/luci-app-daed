<script type="text/javascript">
//<![CDATA[
	var daedLogState = {
		autoScroll: true,
		paused: false,
		level: 'ALL',
		rawText: ''
	};

	var logUrl = '<%=url([[admin]], [[services]], [[daed]], [[get_log]])%>';
	var metaUrl = '<%=url([[admin]], [[services]], [[daed]], [[log_meta]])%>';
	var clearUrl = '<%=url([[admin]], [[services]], [[daed]], [[clear_log]])%>';
	var downloadUrl = '<%=url([[admin]], [[services]], [[daed]], [[download_log]])%>';

	function daedFormatBytes(bytes) {
		if (!bytes || bytes < 1024)
			return (bytes || 0) + ' B';
		if (bytes < 1024 * 1024)
			return (bytes / 1024).toFixed(1) + ' KB';
		return (bytes / 1024 / 1024).toFixed(1) + ' MB';
	}

	function daedEscapeHtml(text) {
		return String(text || '')
			.replace(/&/g, '&amp;')
			.replace(/</g, '&lt;')
			.replace(/>/g, '&gt;')
			.replace(/"/g, '&quot;')
			.replace(/'/g, '&#39;');
	}

	function daedNormalizeLevel(level) {
		var normalized = String(level || '').toUpperCase();

		if (normalized === 'WARNING')
			return 'WARN';
		if (normalized === 'ERR')
			return 'ERROR';

		return normalized;
	}

	function daedDetectLevel(line) {
		var parsed = daedParseLine(line);
		if (parsed.level)
			return parsed.level;
		return 'OTHER';
	}

	function daedParseLine(line) {
		var text = String(line || '');
		var parsed = {
			time: '',
			level: '',
			content: text
		};

		var m = text.match(/time="([^"]+)"\s+level=([a-zA-Z]+)\s+msg="([^"]*)"\s*(.*)$/);
		if (m) {
			parsed.time = m[1] || '';
			parsed.level = daedNormalizeLevel(m[2] || '');
			parsed.content = m[3] || '';
			if (m[4] && m[4].trim() !== '')
				parsed.content += '  ' + m[4].trim();
			return parsed;
		}

		m = text.match(/^\[([0-9]{4}-[0-9]{2}-[0-9]{2}\s+\d{2}:\d{2}:\d{2})\]\s+([A-Z]+)\s+(.*)$/);
		if (m) {
			parsed.time = m[1] || '';
			parsed.level = daedNormalizeLevel(m[2] || '');
			parsed.content = m[3] || '';
			return parsed;
		}

		m = text.match(/^((?:[A-Z][a-z]{2}\s+\d{2}\s+)?\d{2}:\d{2}:\d{2})\s+([A-Z]+)\s+(.*)$/);
		if (m) {
			parsed.time = m[1] || '';
			parsed.level = daedNormalizeLevel(m[2] || '');
			parsed.content = m[3] || '';
			return parsed;
		}

		m = text.match(/\blevel=([a-zA-Z]+)\b/);
		if (m) {
			parsed.level = daedNormalizeLevel(m[1] || '');
			parsed.content = text.replace(/\btime="[^"]+"\s*/, '').replace(/\blevel=[a-zA-Z]+\s*/, '').trim();
			return parsed;
		}

		m = text.match(/\b(INFO|WARN(?:ING)?|ERR(?:OR)?)\b/);
		if (m)
			parsed.level = daedNormalizeLevel(m[1]);

		return parsed;
	}

	function daedApplyLevelFilter(lines) {
		if (daedLogState.level === 'ALL')
			return lines;

		return lines.filter(function(line) {
			return daedDetectLevel(line) === daedLogState.level;
		});
	}

	function daedRenderLogs() {
		var logPanel = document.getElementById('log_panel');
		var lines = daedLogState.rawText.split(/\r?\n/).filter(function(line) {
			return line.length > 0;
		});
		lines = daedApplyLevelFilter(lines);

		var header = '' +
			'<div class="daed-log-table-head">' +
				'<div class="daed-log-col-time"><%:Time%></div>' +
				'<div class="daed-log-col-level"><%:Level%></div>' +
				'<div class="daed-log-col-content"><%:Content%></div>' +
			'</div>';

		var rows = lines.map(function(line) {
			var parsed = daedParseLine(line);
			var level = parsed.level || 'OTHER';
			var timeText = parsed.time ? daedEscapeHtml(parsed.time) : '-';
			var levelText = level === 'OTHER' ? '-' : daedEscapeHtml(level);
			var contentText = daedEscapeHtml(parsed.content || line);

			return '' +
				'<div class="daed-log-row">' +
					'<div class="daed-log-col-time">' + timeText + '</div>' +
					'<div class="daed-log-col-level"><span class="daed-log-level level-' + level.toLowerCase() + '">' + levelText + '</span></div>' +
					'<div class="daed-log-col-content">' + contentText + '</div>' +
				'</div>';
		}).join('');

		var html = '';

		if (!rows)
			html = '<div class="daed-log-empty"><%:No log entries%></div>';
		else
			html = header + '<div class="daed-log-body">' + rows + '</div>';

		logPanel.innerHTML = html;

		if (daedLogState.autoScroll) {
			logPanel.scrollTop = logPanel.scrollHeight;
		}
	}

	function daedRefreshMeta() {
		XHR.get(metaUrl, null, function(x, data) {
			if (!data)
				return;

			document.getElementById('log_size').textContent = daedFormatBytes(data.size || 0);
			document.getElementById('log_live').textContent = daedLogState.paused ? 'paused' : (data.running ? 'live' : 'stopped');
		});
	}

	function daedFetchLogs() {
		if (daedLogState.paused)
			return;

		XHR.get(logUrl, null, function(x) {
			if (x && x.status == 200) {
				daedLogState.rawText = x.responseText || '';
				daedRenderLogs();
			}
		});
		daedRefreshMeta();
	}

	function daedToggleAutoScroll(el) {
		daedLogState.autoScroll = !!el.checked;
		if (daedLogState.autoScroll) {
			var logPanel = document.getElementById('log_panel');
			logPanel.scrollTop = logPanel.scrollHeight;
		}
	}

	function daedTogglePause(el) {
		daedLogState.paused = !!el.checked;
		daedRefreshMeta();
		if (!daedLogState.paused)
			daedFetchLogs();
	}

	function daedChangeLevel(el) {
		daedLogState.level = el.value || 'ALL';
		daedRenderLogs();
	}

	function daedClearDisplay() {
		daedLogState.rawText = '';
		daedRenderLogs();
		document.getElementById('log_size').textContent = '0 B';
	}

	function daedDownloadLog() {
		window.open(downloadUrl, '_blank');
		return false;
	}

	function daedClearLog() {
		if (!window.confirm('<%:Are you sure you want to clear the log file?%>'))
			return false;

		XHR.get(clearUrl, null, function(x) {
			if (x && x.status == 200) {
				daedLogState.rawText = '';
				daedRenderLogs();
				daedRefreshMeta();
			}
		});
		return false;
	}

	XHR.poll(3, logUrl, null, function(x) {
		if (daedLogState.paused)
			return;

		if (x && x.status == 200) {
			daedLogState.rawText = x.responseText || '';
			daedRenderLogs();
		}
	});

	XHR.poll(3, metaUrl, null, function(x, data) {
		if (!data)
			return;

		document.getElementById('log_size').textContent = daedFormatBytes(data.size || 0);
		document.getElementById('log_live').textContent = daedLogState.paused ? 'paused' : (data.running ? 'live' : 'stopped');
	});

	window.setTimeout(function() {
		daedFetchLogs();
	}, 50);
//]]>
</script>

<style type="text/css">
	.daed-log-shell {
		border-radius: 8px;
		background: transparent;
		color: inherit;
		padding: 16px;
		border: 1px solid rgba(127, 127, 127, 0.18);
	}

	.daed-log-head {
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 16px;
		margin-bottom: 14px;
	}

	.daed-log-title {
		font-size: 15px;
		font-weight: 600;
		color: inherit;
	}

	.daed-log-meta {
		font-family: monospace;
		opacity: 0.75;
	}

	.daed-log-toolbar {
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 12px;
		flex-wrap: wrap;
		margin-bottom: 14px;
	}

	.daed-log-controls,
	.daed-log-actions {
		display: flex;
		align-items: center;
		gap: 10px;
		flex-wrap: wrap;
	}

	.daed-log-check {
		display: inline-flex;
		align-items: center;
		gap: 6px;
		color: inherit;
	}

	.daed-log-select {
		min-width: 120px;
	}

	.daed-log-shell .cbi-button {
		margin: 0;
	}

	.daed-log-panel {
		height: 640px;
		overflow: auto;
		background: rgba(127, 127, 127, 0.08);
		border-radius: 8px;
		border: 1px solid rgba(127, 127, 127, 0.14);
		padding: 0;
		font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
		font-size: 13px;
		line-height: 1.6;
		white-space: pre-wrap;
		word-break: break-word;
	}

	.daed-log-table-head,
	.daed-log-row {
		display: grid;
		grid-template-columns: 150px 88px minmax(0, 1fr);
		gap: 12px;
		align-items: start;
	}

	.daed-log-table-head {
		position: sticky;
		top: 0;
		z-index: 2;
		padding: 14px 16px 10px;
		margin: 0;
		border-bottom: 1px solid rgba(127, 127, 127, 0.14);
		background-color: rgba(255, 255, 255, 0.96);
		-webkit-backdrop-filter: blur(10px);
		backdrop-filter: blur(10px);
		box-shadow: 0 1px 0 rgba(127, 127, 127, 0.10);
		font-size: 12px;
		font-weight: 700;
		color: rgba(60, 60, 67, 0.78);
		text-transform: none;
	}

	@media (prefers-color-scheme: dark) {
		.daed-log-table-head {
			background-color: rgba(24, 24, 27, 0.96);
			color: rgba(255, 255, 255, 0.82);
		}
	}

	.daed-log-body {
		padding: 16px 16px 14px;
	}

	.daed-log-row {
		padding: 6px 0;
		border-bottom: 1px dashed rgba(127, 127, 127, 0.08);
	}

	.daed-log-col-time,
	.daed-log-col-level {
		white-space: nowrap;
	}

	.daed-log-col-content {
		min-width: 0;
		white-space: pre-wrap;
		word-break: break-word;
	}

	.daed-log-level {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		min-width: 52px;
		padding: 1px 8px;
		border-radius: 999px;
		font-weight: 700;
		letter-spacing: 0;
		background: rgba(127, 127, 127, 0.10);
	}

	.daed-log-level.level-info {
		color: #16a34a;
		background: rgba(22, 163, 74, 0.12);
	}

	.daed-log-level.level-warn {
		color: #d97706;
		background: rgba(217, 119, 6, 0.12);
	}

	.daed-log-level.level-error {
		color: #dc2626;
		background: rgba(220, 38, 38, 0.12);
	}

	.daed-log-level.level-other {
		opacity: 0.65;
	}

	.daed-log-empty {
		opacity: 0.7;
	}
</style>

<fieldset class="cbi-section" id="_log_fieldset">
	<div class="daed-log-shell">
		<div class="daed-log-head">
			<div class="daed-log-title"><%:DAED Live Logs%></div>
			<div class="daed-log-meta"><span id="log_size">0 B</span> · <span id="log_live">live</span></div>
		</div>

		<div class="daed-log-toolbar">
			<div class="daed-log-controls">
				<label class="daed-log-check">
					<input type="checkbox" checked="checked" onchange="daedToggleAutoScroll(this)">
					<span><%:Auto scroll%></span>
				</label>
				<label class="daed-log-check">
					<input type="checkbox" onchange="daedTogglePause(this)">
					<span><%:Pause%></span>
				</label>
				<select class="cbi-input-select daed-log-select" onchange="daedChangeLevel(this)">
					<option value="ALL"><%:All%></option>
					<option value="INFO">INFO</option>
					<option value="WARN">WARN</option>
					<option value="ERROR">ERROR</option>
				</select>
			</div>

			<div class="daed-log-actions">
				<button class="cbi-button" type="button" onclick="daedClearDisplay()"><%:Clear display%></button>
				<button class="cbi-button" type="button" onclick="return daedDownloadLog()"><%:Download%></button>
				<button class="cbi-button cbi-button-remove" type="button" onclick="return daedClearLog()"><%:Clear logs%></button>
			</div>
		</div>

		<div id="log_panel" class="daed-log-panel">
			<div class="daed-log-empty"><%:Collecting data...%></div>
		</div>
	</div>
</fieldset>
