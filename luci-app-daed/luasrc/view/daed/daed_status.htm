<%
	local uci = require("luci.model.uci").cursor()
	local listen_addr = uci:get_first("daed", "daed", "listen_addr") or ""
	local dashboard_port = uci:get_first("daed", "daed", "dashboard_port") or ""
%>
<script type="text/javascript">//<![CDATA[
	function daedResolveWebUIUrl() {
		var listenAddr = "<%=listen_addr%>";
		var dashboardPort = "<%=dashboard_port%>";
		var port = "";

		if (dashboardPort && dashboardPort.trim() !== "") {
			port = dashboardPort.trim();
		} else {
			var match = listenAddr.match(/:(\d+)/);
			if (match && match[1])
				port = match[1];
		}

		if (!port)
			return "";

		var protocol = window.location.protocol;
		var hostname = window.location.hostname;
		var url = protocol + "//" + hostname;

		if (!((protocol === "http:" && port === "80") || (protocol === "https:" && port === "443")))
			url += ":" + port;

		return url;
	}

	function daedOpenWebUI() {
		var url = daedResolveWebUIUrl();
		if (!url)
			return false;

		window.open(url, "_blank", "noopener");
		return false;
	}

	function daedRestartCore(button) {
		var statusEl = document.getElementById('daed_restart_status');
		button.disabled = true;
		if (statusEl)
			statusEl.textContent = '<%:Restarting...%>';

		XHR.get('<%=url([[admin]], [[services]], [[daed]], [[restart_core]])%>', null, function(x, data) {
			button.disabled = false;
			if (!statusEl)
				return;

			if (x && x.status == 200 && data && data.ok)
				statusEl.textContent = '<%:Restart completed%>';
			else
				statusEl.textContent = '<%:Restart failed%>';
		});
	}

	XHR.poll(3, '<%=url([[admin]], [[services]], [[daed_status]])%>', null,
		function(x, data) {
			var tb = document.getElementById('daed_status_text');
			if (data && tb)
			{
				if (data.running)
				{
					tb.innerHTML = '<em><b style=\"color:green\"><%:DAED%> <%:RUNNING%></b></em>';
				}
				else
				{
					tb.innerHTML = '<em><b style=\"color:red\"><%:DAED%> <%:NOT RUNNING%></b></em>';
				}
			}
		}
	);
//]]></script>
<style type="text/css">
	.daed-status-bar {
		display: flex;
		align-items: center;
		gap: 12px;
		flex-wrap: wrap;
	}

	.daed-status-actions {
		display: flex;
		align-items: center;
		gap: 10px;
		flex-shrink: 0;
	}

	.daed-status-bar p {
		margin: 0;
	}

	.daed-status-note {
		font-size: 12px;
		opacity: 0.75;
	}

	.cbi-section:last-of-type .cbi-section-node {
		padding-bottom: 24px;
	}
</style>
<fieldset class="cbi-section">
	<div class="daed-status-bar">
		<p id="daed_status_text">
			<em><%:Collecting data...%></em>
		</p>
		<div class="daed-status-actions">
			<button class="cbi-button cbi-button-action" type="button" onclick="return daedOpenWebUI();"><%:Open WebUI%></button>
			<button class="cbi-button cbi-button-action" type="button" onclick="daedRestartCore(this)"><%:Restart Core%></button>
			<span id="daed_restart_status" class="daed-status-note"></span>
		</div>
	</div>
</fieldset>
